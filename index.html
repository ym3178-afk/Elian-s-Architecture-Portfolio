/* ===== 2026 Editorial Architecture Redesign ===== */
:root{
  --paper:#F4F1EA;
  --paper-2:#F8F6F1;
  --ink:#171714;
  --muted:#6E6A62;
  --line:rgba(23,23,20,.16);
  --line-strong:rgba(23,23,20,.42);
  --gutter:clamp(1.25rem,4.6vw,6.5rem);
  --space:clamp(5rem,9vw,10rem);
  --serif:"Iowan Old Style","Baskerville","Times New Roman",serif;
  --sans:"Architectural Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
}

html{background:var(--paper);scroll-padding-top:6rem}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:clamp(.95rem,.25vw + .9rem,1.05rem);
  letter-spacing:-.01em;
  text-rendering:optimizeLegibility;
}
::selection{background:#d9d2c5;color:var(--ink)}

/* Header */
header{
  position:sticky;
  top:0;
  z-index:30;
  min-height:4.5rem;
  padding:1.15rem var(--gutter);
  background:rgba(244,241,234,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
nav{gap:clamp(1rem,2.7vw,2.8rem);font-size:.78rem;letter-spacing:.045em}
nav a{color:var(--muted);padding:.45rem 0;transition:color .2s ease,border-color .2s ease}
nav a:hover,nav a[aria-current]{color:var(--ink);border-color:var(--ink)}

/* Global display typography */
h1,h2,h3{font-weight:400}
.intro-copy h1,
.project-info h2,
.page-title h1,
.project-title h1,
.about-hero h1,
.profile-panel h2,
.contact h1,
.next-project h2{
  font-family:var(--serif);
  font-weight:400;
  letter-spacing:-.055em;
}
.eyebrow{
  font-family:var(--sans);
  font-size:.69rem;
  line-height:1.45;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

/* Home / intro */
.intro-cover{
  min-height:calc(100svh - 4.5rem);
  padding:clamp(3.2rem,6vw,7rem) var(--gutter) clamp(3rem,5vw,5rem);
  grid-template-columns:minmax(0,1.4fr) minmax(17rem,.65fr);
  gap:clamp(3rem,7vw,8.5rem);
  align-items:center;
  align-content:center;
}
.intro-copy{max-width:58rem}
.intro-copy h1{
  font-size:clamp(5.2rem,10.6vw,12.7rem);
  line-height:.79;
  letter-spacing:-.072em;
  margin:clamp(1.5rem,2.5vw,2.6rem) 0 2rem;
}
.name-period{color:#a39b8d}
.intro-bio{
  max-width:37rem;
  font-size:clamp(1rem,1vw + .62rem,1.28rem);
  line-height:1.62;
  color:#57544e;
}
.intro-actions{margin-top:2.5rem;gap:1rem 2.2rem;font-size:.78rem;letter-spacing:.045em}
.intro-actions a{border-bottom:1px solid var(--line-strong);padding-bottom:.55rem}
.intro-actions a:hover{border-color:var(--ink)}
.intro-portrait{
  width:min(100%,29rem);
  justify-self:end;
}
.intro-portrait img{
  aspect-ratio:1/1;
  object-fit:cover;
  object-position:center;
  background:var(--paper-2);
}
.intro-portrait figcaption{
  padding:.85rem 0 0;
  border:0;
  font-size:.64rem;
  letter-spacing:.14em;
  color:var(--muted);
}
.intro-education{
  grid-column:1/-1;
